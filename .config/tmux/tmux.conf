# scrollback size
set -g history-limit 10000

################################
# Keybinds
###############################

# Changing ctrl b to ctrl a as the command button
unbind C-b
set -g prefix C-a

# set first window to index 1 (not 0) to map more to the keyboard layout
set -g base-index 1
set -g pane-base-index 1

# pass through xterm keys
# TODO - Verify if its the case, since I'm using alacritty
# set -g xterm-keys on

# Keep your finger on ctrl, or don't, same result
bind-key C-d detach-client
bind-key C-p paste-buffer

# Redraw the client (if interrupted by wall, etc)
bind R refresh-client

# Vertical splits with g or C-g
unbind g 
unbind C-g
#bind-key g split-window -h
#bind-key C-g split-window -h
bind - split-window -v

# Horizontal splits
unbind h
unbind C-h
#bind-key h split-window
#bind-key C-h split-window
bind | split-window -h

# Pane input sync
bind G setw synchronize-panes

# Switching panes with alt
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Using the mouse to switch panes
#set -g mouse-utf8 on
set -g mouse on

# Ctrl + a + Pagedown : Next window
#unbind Pagedown
unbind Pagedown
bind-key Pagedown next-window

# Ctrl + a + Pagup : Previous window
#unbind Pageup
unbind Pageup
bind-key Pageup previous-window



# Ctrl + a + n : New session
unbind n
unbind C-n
bind-key n new-session
bind-key C-n new-session

# Ctrl - t or t new window
unbind t
unbind C-t
bind-key t new-window
bind-key C-t new-window

# Ctrl - w or w to kill panes
unbind w
unbind C-w
bind-key w kill-pane
bind-key C-w kill-pane

# Visual Activity Monitoring between windows
setw -g monitor-activity on
set -g visual-activity on

# Show tmux positions in titles
set -g set-titles on

# Source .tmux.conf as suggested in `man tmux`
bind r source-file ~/.config/tmux/tmux.conf \; \
            display-message "source-file done"

# Address vim mode switching delay (http://superuser.com/a/252717/65504)
set -s escape-time 0

# Increase scrollback buffer size from 2000 to 50000 lines
set -g history-limit 50000

# Increase tmux messages display duration from 750ms to 4s
set -g display-time 4000

# Refresh 'status-left' and 'status-right' more often, from every 15s to 5s
set -g status-interval 5
# Upgrade $TERM
set -g default-terminal "screen-256color"
# Focus events enabled for terminals that support them
set -g focus-events on

# Super useful when using "grouped sessions" and multi-monitor setup
setw -g aggressive-resize on


#####################################
# Plugins
#https://github.com/tmux-plugins/tpm
####################################

#####################################
# tpm plugin manager
# https://github.com/tmux-plugins/tpm 
#####################################
set -g @plugin 'tmux-plugins/tpm'

######################################
# tmux-continuum - automatically save and restore tmux sessions
# https://github.com/tmux-plugins/tmux-continuum
#####################################
set -g @plugin 'tmux-plugins/tmux-continuum'
# Restore last saved enviroment
set -g @continuum-restore 'on'
# Set autosave interval
set -g @continuum-save-interval '5'

######################################
# tmux-ressurrect - save tmux sessions 
# https://github.com/tmux-plugins/tmux-resurrect
#####################################

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'ssh'

###################################################
# https://github.com/spywhere/tmux-named-snapshot
###################################################

set -g @plugin 'spywhere/tmux-named-snapshot'

# Show continiuum state in statusbar
#set -g status-right 'Continuum status: #{continuum_status}'
# Starting tmux with system https://github.com/tmux-plugins/tmux-continuum/blob/master/docs/automatic_start.md

#####################################
# tmux-yank - copy to system clipboard
# https://github.com/tmux-plugins/tmux-yank
######################################
set -g @plugin 'tmux-plugins/tmux-yank'

#####################################
# tmux- scroll
# https://github.com/noscript/tmux-mighty-scroll
#####################################
set -g @plugin 'noscript/tmux-mighty-scroll'

#####################################
# tmux zoom pane
# https://github.com/jaclu/tmux-power-zoom
#####################################
set -g @plugin 'jaclu/tmux-power-zoom'
set -g @power_zoom_mouse_action DoubleClick3Pane

#####################################
# tmux tree side bar
# https://github.com/tmux-plugins/tmux-sidebar
#####################################
set -g @plugin 'tmux-plugins/tmux-sidebar'

#####################################
# tmux mode indicator status bar
# https://github.com/MunifTanjim/tmux-mode-indicator
#####################################
set -g @plugin 'MunifTanjim/tmux-mode-indicator'
set -g status-right '%Y-%m-%d %H:%M #{tmux_mode_indicator}'

#####################################
# tmux theme
# https://github.com/nordtheme/tmux
#####################################
set -g @plugin "nordtheme/tmux"

#########################################
run '~/.tmux/plugins/tpm/tpm'
